<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#C82028"><title>麦合拍 MaiMate · 你的饭搭子</title><link rel="stylesheet" href="/agent.css"><script src="/app.js" defer></script><link rel="stylesheet" href="/navigation.css"></head>
<body class="workspace workspace-chat">
<!-- workspace-navigation -->
<div class="workspace-content" id="workspace-content" tabindex="-1">
<header class="chat-toolbar"><span class="live-state" id="connection" role="status">连接中</span><button id="mobileTicket" class="ticket-toggle" aria-controls="orderPane">当前订单</button></header>
<main class="agent-layout">
<section class="conversation" aria-label="点餐对话">
<div class="chat-top"><div><h1>合口味，也合拍。</h1><p>记得你的口味，也听你今天想吃什么。</p></div><button id="newOrder" class="quiet-button">重新点餐</button></div>
<div id="chatLog" class="chat-log" role="log" aria-live="polite" aria-relevant="additions">
<article class="message assistant"><span class="avatar" aria-hidden="true">合</span><div class="bubble"><p>今天想稳稳吃点喜欢的，还是换个口味？<br>先聊聊也行。到店后，我再查这家店真正能点的。</p><div class="starter-actions"><button id="locateStart" class="locate-start">⌖ 使用当前位置</button><button data-message="按老样子推荐">按老样子，你帮我选</button><button data-message="换换口味">今天试点新口味</button><button data-message="记住，我喜欢无糖饮料">记住，我喜欢无糖饮料</button></div></div></article>
</div>
<div class="composer-wrap"><div class="memory-strip"><a href="/memory" id="memoryHint">口味手记</a><button class="quiet-button" data-message="我的偏好">你记住了什么</button><button class="quiet-button" data-message="评价上一餐">评价上一餐</button><button class="quiet-button" data-message="口味复盘">口味复盘</button></div><div id="activity" class="activity" role="status"></div><form id="chatForm" class="composer"><button id="locateButton" type="button" class="location-button" aria-label="使用当前位置" title="授权本次定位">⌖</button><label class="sr-only" for="chatInput">点餐需求</label><textarea id="chatInput" rows="1" maxlength="2000" placeholder="想吃什么，直接说。比如“第二个，饮料换无糖”"></textarea><button id="sendButton" class="send-button" type="submit" aria-label="发送需求">发送</button></form><p class="composer-note"><span id="modelState">正在读取模型连接</span><span>下单后在官方收银台确认付款</span></p></div>
</section>
<aside class="order-pane" id="orderPane" aria-label="当前订单"><button id="closeTicket" class="close-ticket" aria-label="收起当前订单">收起 ×</button><div class="ticket"><div class="ticket-band"><span>这一单</span><span class="ticket-mark" aria-hidden="true">合</span></div><div class="ticket-body" id="ticketBody"><div class="empty-ticket"><span class="order-symbol" aria-hidden="true">♨</span><h2>下一餐，听你的。</h2><p>选好套餐后，真实搭配、应付金额和取餐信息都在这里。</p><div class="ticket-flow"><span>选一家店</span><i></i><span>挑个套餐</span><i></i><span>确认下单</span></div></div></div><div class="ticket-teeth"></div></div><p class="order-footnote">门店、餐品和订单来自麦当劳中国 MCP。</p></aside>
</main></div></body></html>
